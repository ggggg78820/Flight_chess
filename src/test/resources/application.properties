# ============================================================
# 測試專用設定檔。
# Maven 執行測試時，src/test/resources 會排在 src/main/resources 前面，
# 所以同名的 application.properties 在這裡的內容會蓋過主設定檔的版本——
# 這代表所有測試（包含 @SpringBootTest 啟動完整容器的 DemoApplicationTests）
# 都是連這裡設定的 H2 記憶體資料庫，完全不會去連正式的 MySQL，
# 也就不需要任何密碼、不會有洩漏正式帳密的風險。
# ============================================================

spring.application.name=demo

# --- 資料庫連線設定（H2 記憶體資料庫）---
# jdbc:h2:mem:flight_chess         -> 建立一個名為 flight_chess、只存在記憶體裡的資料庫
# DB_CLOSE_DELAY=-1                -> 保持資料庫存活直到 JVM（測試程序）結束，避免連線一斷資料庫就被清空
# MODE=MySQL                       -> 讓 H2 模擬 MySQL 的語法/行為，跟正式環境的資料庫種類盡量一致
spring.datasource.url=jdbc:h2:mem:flight_chess;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate 設定 ---
# ddl-auto=update：測試啟動時，Hibernate 會依照 @Entity 類別自動建立資料表結構
# （H2 是全新的空資料庫，所以每次測試執行實際上等同從零建表）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
